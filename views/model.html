<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{name}} — AI Model Directory</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="container" style="max-width: 700px;">

    <nav class="back-nav">
      <a href="/">← Back to Directory</a>
    </nav>

    <article class="detail-card">
      <header class="detail-header">
        <div class="logo-wrap lg" data-initial="{{initial}}">
          <img src="{{logo}}" alt="{{name}} logo"
               onerror="this.style.display='none';this.parentNode.classList.add('fallback')">
        </div>
        <hgroup>
          <h1>{{name}}</h1>
          <p>{{company}}</p>
        </hgroup>
      </header>

      <div class="meta-grid">
        <div class="meta-item">
          <small>Category</small>
          <strong><span class="badge">{{category}}</span></strong>
        </div>
        <div class="meta-item">
          <small>Release Year</small>
          <strong>{{releaseYear}}</strong>
        </div>
      </div>

      <p class="detail-description">{{description}}</p>

      <footer>
        <a href="{{website}}" target="_blank" rel="noopener noreferrer" role="button">
          Visit Official Website ↗
        </a>
      </footer>
    </article>

  </main>
</body>
</html>
